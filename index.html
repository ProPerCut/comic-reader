<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comic Reader</title>

  <link rel="stylesheet" href="style.css">

  <!-- Browser archive reader: ZIP / CBZ / RAR / CBR -->
  <script src="https://xenova.github.io/unarchiver.js/dist/unarchiver.min.js"></script>

  <!-- PDF Reader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

  <!-- =========================
       TOP CONTROL BAR
  ========================== -->

  <header class="control-bar">

    <div class="brand">
      📖 Comic Reader
    </div>

    <div class="controls">

      <!-- Comic File -->
      <label for="file-input" class="btn file-btn">
        📁 Comic খুলুন
      </label>

      <input
        type="file"
        id="file-input"
        multiple
        accept=".cbz,.cbr,.zip,.rar,.pdf,.jpg,.jpeg,.png,.webp,.gif"
        hidden
      >

      <!-- Image Folder -->
      <label for="folder-input" class="btn">
        📂 Folder
      </label>

      <input
        type="file"
        id="folder-input"
        webkitdirectory
        directory
        multiple
        accept="image/*"
        hidden
      >

      <!-- Auto Scroll -->
      <button id="scroll-toggle" class="btn auto-btn">
        ▶ Auto Scroll
      </button>

      <!-- Speed -->
      <div class="speed-box">

        <span>Speed</span>

        <input
          type="range"
          id="speed-range"
          min="10"
          max="1000"
          value="150"
          step="10"
        >

        <span id="speed-val">150</span>

        <span>px/s</span>

      </div>

      <!-- Zoom -->
      <button id="zoom-out" class="btn small-btn">
        −
      </button>

      <span id="zoom-val">
        100%
      </span>

      <button id="zoom-in" class="btn small-btn">
        +
      </button>

      <!-- Fit Width -->
      <button id="fit-width" class="btn">
        ↔ Fit
      </button>

      <!-- Fullscreen -->
      <button id="fullscreen-btn" class="btn">
        ⛶
      </button>

    </div>

  </header>


  <!-- =========================
       STATUS BAR
  ========================== -->

  <div id="status-bar">

    <span id="status-text">
      কোনো Comic খোলা হয়নি
    </span>

    <span id="page-count">
      0 pages
    </span>

  </div>


  <!-- =========================
       READER
  ========================== -->

  <main id="reader-container">

    <section id="placeholder">

      <div class="welcome-icon">
        📖
      </div>

      <h1>Comic Reader</h1>

      <p>
        CBZ, CBR, ZIP, PDF অথবা Image খুলে পড়ুন
      </p>

      <p class="small-help">
        উপরের <b>Comic খুলুন</b> button চাপুন
        অথবা Comic file এখানে Drag & Drop করুন।
      </p>

    </section>


    <div id="pages-list"></div>

  </main>


  <!-- =========================
       BOTTOM MOBILE CONTROLS
  ========================== -->

  <div id="mobile-controls">

    <button id="mobile-scroll" class="mobile-btn">
      ▶
    </button>

    <input
      type="range"
      id="mobile-speed"
      min="10"
      max="1000"
      value="150"
      step="10"
    >

    <button id="mobile-zoom-out" class="mobile-btn">
      −
    </button>

    <button id="mobile-zoom-in" class="mobile-btn">
      +
    </button>

  </div>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
