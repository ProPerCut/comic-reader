<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Reader & Auto Scroller</title>
  <link rel="stylesheet" href="style.css">
  <!-- JSZip Library for CBZ / ZIP files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- Top Navigation & Control Bar -->
  <header class="control-bar">
    <div class="brand">📖 Comic Reader</div>
    
    <div class="controls">
      <!-- File Loader (No strict accept filter so ALL files show up) -->
      <label for="file-input" class="btn">
        📁 ফাইল সিলেক্ট করুন (.cbr / .cbz / .zip / Images)
      </label>
      <input type="file" id="file-input" multiple style="display:none;">

      <!-- Auto Scroll Controls -->
      <div class="scroll-controls">
        <button id="scroll-toggle" class="btn btn-toggle">▶ অটো-স্ক্রোল শুরু</button>
        <label for="speed-range">স্পিড:</label>
        <input type="range" id="speed-range" min="1" max="10" value="3">
        <span id="speed-val">3x</span>
      </div>
    </div>
  </header>

  <!-- Comic Display Container -->
  <main id="reader-container">
    <div id="placeholder">
      <h2>কমিক ফাইল ড্রপ করুন অথবা উপরে ক্লিক করে সিলেক্ট করুন</h2>
      <p>আপনার কম্পিউটারের যেকোনো .cbz, .cbr, .zip অথবা ছবির ফোল্ডার সিলেক্ট বা Drag & Drop করুন।</p>
    </div>
    <div id="pages-list"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
